# Keep at least one replica of each service during voluntary disruptions
# (node drain, rollout). policy/v1 is GA.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: api-gateway
  namespace: fraud-detection
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: api-gateway
---
