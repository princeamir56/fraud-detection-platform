# Risk scoring: gRPC server (internal-only) invoked synchronously by
# fraud-detection-service. Exposes HTTP actuator on 8085 and gRPC on 9095.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: risk-scoring-service
  namespace: fraud-detection
  labels:
    app.kubernetes.io/name: risk-scoring-service
    app.kubernetes.io/part-of: fraud-detection-platform
    app.kubernetes.io/component: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: risk-scoring-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: risk-scoring-service
        app.kubernetes.io/part-of: fraud-detection-platform
        app.kubernetes.io/component: backend
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 0
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: risk-scoring-service
          image: frauddetect/risk-scoring-service:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8085
            - name: grpc
              containerPort: 9095
          envFrom:
            - configMapRef:
                name: platform-config
            - secretRef:
                name: platform-secrets
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          startupProbe:
            httpGet:
              path: /actuator/health
              port: http
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
            failureThreshold: 3
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      terminationGracePeriodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: risk-scoring-service
  namespace: fraud-detection
  labels:
    app.kubernetes.io/name: risk-scoring-service
    app.kubernetes.io/part-of: fraud-detection-platform
spec:
  selector:
    app.kubernetes.io/name: risk-scoring-service
  ports:
    - name: http
      port: 8085
      targetPort: http
    - name: grpc
      port: 9095
      targetPort: grpc
