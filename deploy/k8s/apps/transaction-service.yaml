# Transaction ingestion: REST intake -> persist -> publish transaction.created
# (MySQL: fraud_transaction; Kafka + Schema Registry).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: transaction-service
  namespace: fraud-detection
  labels:
    app.kubernetes.io/name: transaction-service
    app.kubernetes.io/part-of: fraud-detection-platform
    app.kubernetes.io/component: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: transaction-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: transaction-service
        app.kubernetes.io/part-of: fraud-detection-platform
        app.kubernetes.io/component: backend
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 0
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: transaction-service
          image: frauddetect/transaction-service:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8083
          envFrom:
            - configMapRef:
                name: platform-config
            - secretRef:
                name: platform-secrets
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          startupProbe:
            httpGet:
              path: /actuator/health
              port: http
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
            failureThreshold: 3
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      terminationGracePeriodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: transaction-service
  namespace: fraud-detection
  labels:
    app.kubernetes.io/name: transaction-service
    app.kubernetes.io/part-of: fraud-detection-platform
spec:
  selector:
    app.kubernetes.io/name: transaction-service
  ports:
    - name: http
      port: 8083
      targetPort: http
