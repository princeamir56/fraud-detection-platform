# DEV/DEMO ONLY Kibana for exploring the Elasticsearch indices (alerts, audit,
# fraud search) and building the dashboards in deploy/kibana. Exposed via the
# Ingress at kibana.fraud.local.
apiVersion: v1
kind: Service
metadata:
  name: kibana
  namespace: fraud-detection
  labels:
    app.kubernetes.io/name: kibana
    app.kubernetes.io/part-of: fraud-detection-platform
spec:
  selector:
    app.kubernetes.io/name: kibana
  ports:
    - name: http
      port: 5601
      targetPort: 5601
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kibana
  namespace: fraud-detection
  labels:
    app.kubernetes.io/name: kibana
    app.kubernetes.io/part-of: fraud-detection-platform
    app.kubernetes.io/component: observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kibana
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kibana
        app.kubernetes.io/part-of: fraud-detection-platform
        app.kubernetes.io/component: observability
    spec:
      containers:
        - name: kibana
          image: docker.elastic.co/kibana/kibana:9.0.4
          ports:
            - name: http
              containerPort: 5601
          env:
            - name: ELASTICSEARCH_HOSTS
              value: http://elasticsearch:9200
          resources:
            requests:
              cpu: "200m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          readinessProbe:
            httpGet:
              path: /api/status
              port: http
            initialDelaySeconds: 40
            periodSeconds: 15
            failureThreshold: 20
          livenessProbe:
            httpGet:
              path: /api/status
              port: http
            initialDelaySeconds: 120
            periodSeconds: 30
            failureThreshold: 6
