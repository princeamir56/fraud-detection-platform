# DEV/DEMO ONLY single-node Elasticsearch (security disabled, memory-lock off so
# no IPC_LOCK capability is needed). Production: use ECK (Elastic Cloud on
# Kubernetes) or a managed cluster with security enabled.
#
# NOTE: the cluster node may need `vm.max_map_count=262144`. On kind/minikube:
#   minikube ssh -- sudo sysctl -w vm.max_map_count=262144
apiVersion: v1
kind: Service
metadata:
  name: elasticsearch
  namespace: fraud-detection
  labels:
    app.kubernetes.io/name: elasticsearch
    app.kubernetes.io/part-of: fraud-detection-platform
spec:
  selector:
    app.kubernetes.io/name: elasticsearch
  ports:
    - name: http
      port: 9200
      targetPort: 9200
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: elasticsearch
  namespace: fraud-detection
  labels:
    app.kubernetes.io/name: elasticsearch
    app.kubernetes.io/part-of: fraud-detection-platform
    app.kubernetes.io/component: search
spec:
  serviceName: elasticsearch
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: elasticsearch
  template:
    metadata:
      labels:
        app.kubernetes.io/name: elasticsearch
        app.kubernetes.io/part-of: fraud-detection-platform
        app.kubernetes.io/component: search
    spec:
      securityContext:
        fsGroup: 1000
      containers:
        - name: elasticsearch
          image: docker.elastic.co/elasticsearch/elasticsearch:9.0.4
          ports:
            - name: http
              containerPort: 9200
          env:
            - name: discovery.type
              value: single-node
            - name: xpack.security.enabled
              value: "false"
            - name: bootstrap.memory_lock
              value: "false"
            - name: ES_JAVA_OPTS
              value: "-Xms512m -Xmx512m"
          volumeMounts:
            - name: data
              mountPath: /usr/share/elasticsearch/data
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "1"
              memory: "1536Mi"
          readinessProbe:
            httpGet:
              path: /_cluster/health?wait_for_status=yellow&timeout=1s
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 20
          livenessProbe:
            httpGet:
              path: /_cluster/health
              port: http
            initialDelaySeconds: 90
            periodSeconds: 30
            failureThreshold: 6
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 3Gi
