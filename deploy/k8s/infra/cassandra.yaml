# DEV/DEMO ONLY single-node Cassandra + a one-shot Job that applies the canonical
# schema.cql (keyspace `fraud`, query-first tables with TTLs). Production: use a
# Cassandra operator (e.g. K8ssandra) and manage schema via migrations.
apiVersion: v1
kind: Service
metadata:
  name: cassandra
  namespace: fraud-detection
  labels:
    app.kubernetes.io/name: cassandra
    app.kubernetes.io/part-of: fraud-detection-platform
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: cassandra
  ports:
    - name: cql
      port: 9042
      targetPort: 9042
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: cassandra
  namespace: fraud-detection
  labels:
    app.kubernetes.io/name: cassandra
    app.kubernetes.io/part-of: fraud-detection-platform
    app.kubernetes.io/component: database
spec:
  serviceName: cassandra
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cassandra
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cassandra
        app.kubernetes.io/part-of: fraud-detection-platform
        app.kubernetes.io/component: database
    spec:
      securityContext:
        fsGroup: 999
      containers:
        - name: cassandra
          image: cassandra:5.0
          ports:
            - name: cql
              containerPort: 9042
          env:
            - name: CASSANDRA_CLUSTER_NAME
              value: fraud-cluster
            - name: CASSANDRA_DC
              value: datacenter1
            - name: CASSANDRA_ENDPOINT_SNITCH
              value: GossipingPropertyFileSnitch
            - name: MAX_HEAP_SIZE
              value: 512M
            - name: HEAP_NEWSIZE
              value: 128M
          volumeMounts:
            - name: data
              mountPath: /var/lib/cassandra
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "1"
              memory: "2Gi"
          readinessProbe:
            exec:
              command: ["bash", "-c", "cqlsh -e 'describe keyspaces' >/dev/null 2>&1"]
            initialDelaySeconds: 45
            periodSeconds: 15
            failureThreshold: 12
          livenessProbe:
            exec:
              command: ["bash", "-c", "nodetool status >/dev/null 2>&1"]
            initialDelaySeconds: 90
            periodSeconds: 30
            failureThreshold: 6
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
---
# Applies schema.cql once Cassandra is reachable. Idempotent (schema.cql uses
# IF NOT EXISTS), so re-runs on retry are safe. Schema comes from the
# `cassandra-schema` ConfigMap generated by kustomize from the canonical file.
apiVersion: batch/v1
kind: Job
metadata:
  name: cassandra-schema-init
  namespace: fraud-detection
  labels:
    app.kubernetes.io/part-of: fraud-detection-platform
spec:
  backoffLimit: 20
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: fraud-detection-platform
    spec:
      restartPolicy: OnFailure
      containers:
        - name: apply-schema
          image: cassandra:5.0
          command: ["bash", "-c"]
          args:
            - |
              echo "waiting for cassandra..."
              until cqlsh cassandra -e "describe cluster" >/dev/null 2>&1; do sleep 5; done
              echo "applying schema.cql"
              cqlsh cassandra -f /schema/schema.cql
              echo "cassandra schema applied"
          volumeMounts:
            - name: schema
              mountPath: /schema
              readOnly: true
      volumes:
        - name: schema
          configMap:
            name: cassandra-schema
