server:
  port: 8081
  shutdown: graceful

spring:
  application:
    name: customer-service
  threads:
    virtual:
      enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 20s
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/fraud_customer?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root}
    hikari:
      pool-name: customer-hikari
      maximum-pool-size: 10
      minimum-idle: 2
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true

# JWT: HS256 signing secret is injected from the environment (never hard-coded). Must be >= 32 bytes.
security:
  jwt:
    secret: ${JWT_SECRET:change-me-in-prod-00000000000000000000000000000000}
    issuer: ${JWT_ISSUER:fraud-detection-platform}
    access-token-ttl: ${JWT_TTL:PT1H}
    clock-skew: PT30S

# Default administrator bootstrapped on first startup (credentials come from the environment).
bootstrap:
  admin:
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:admin-change-me}
    email: ${ADMIN_EMAIL:admin@frauddetect.local}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: 1.0
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.frauddetect: INFO

---
spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://mysql:3306/fraud_customer?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
  # Emit ECS-structured JSON logs to stdout so Filebeat/collectors can ship them to Elasticsearch.
logging:
  structured:
    format:
      console: ecs

management:
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://otel-collector:4318/v1/traces}
